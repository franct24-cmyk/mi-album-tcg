<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Álbum">
  <title>Mi Álbum TCG</title>
  <style>
    :root{
      --bg:#0b1020;--card:#141b2d;--card2:#1d2740;--text:#f7f8fb;--muted:#9eabc4;
      --line:#2d3957;--accent:#63e6be;--accent2:#72a7ff;--danger:#ff7b7b;
      --shadow:0 18px 55px rgba(0,0,0,.28)
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#0b1020,#10172a 55%,#0b1020);
      color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    button,input,select{font:inherit}
    .app{max-width:900px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 14px calc(90px + env(safe-area-inset-bottom))}
    header{position:sticky;top:0;z-index:20;background:rgba(11,16,32,.92);backdrop-filter:blur(18px);
      padding:14px 2px 12px;border-bottom:1px solid rgba(255,255,255,.06)}
    .eyebrow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin:0 0 4px}
    h1{font-size:27px;margin:0}
    .toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:12px}
    select,.btn,.search{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px}
    select,.search{width:100%;padding:12px 13px}
    .btn{padding:12px 15px;font-weight:700;cursor:pointer}
    .btn.primary{background:var(--accent);color:#06251d;border-color:transparent}
    .summary{margin:16px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .stat{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
    .stat strong{display:block;font-size:24px;margin-top:4px}
    .progress{height:9px;background:#202a42;border-radius:99px;overflow:hidden;margin-top:10px}
    .progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:18px 2px 10px}
    .section-head h2{font-size:20px;margin:0}
    .section-head span{color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
    @media(min-width:620px){.grid{grid-template-columns:repeat(5,1fr)}}
    .slot{position:relative;aspect-ratio:2.5/3.5;border-radius:13px;border:1px solid var(--line);
      background:linear-gradient(145deg,#161e31,#0f1627);overflow:hidden;cursor:pointer;min-width:0}
    .slot.empty{border-style:dashed}
    .slot img{width:100%;height:100%;object-fit:cover;display:block}
    .slot .num{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.72);border-radius:8px;padding:4px 6px;font-size:11px;font-weight:800}
    .slot .qty{position:absolute;right:6px;top:6px;background:var(--accent);color:#06251d;border-radius:99px;padding:3px 7px;font-size:11px;font-weight:900}
    .placeholder{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#65718b;gap:4px}
    .placeholder b{font-size:19px}.placeholder small{font-size:10px}
    .name{position:absolute;left:0;right:0;bottom:0;padding:18px 7px 6px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:11px;font-weight:700}
    .fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:25;border:0;border-radius:999px;
      padding:15px 18px;background:var(--accent);color:#06251d;font-weight:900;box-shadow:0 16px 45px rgba(0,0,0,.38)}
    .modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);align-items:flex-end;justify-content:center}
    .modal.open{display:flex}
    .sheet{width:min(100%,700px);max-height:88vh;overflow:auto;background:#11192b;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));border:1px solid var(--line)}
    .sheet h3{margin:0 0 8px;font-size:22px}.sheet p{color:var(--muted);margin:0 0 14px}
    .field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    .field input,.field select{width:100%;padding:13px;border-radius:13px;border:1px solid var(--line);background:#0c1323;color:var(--text)}
    .preview{width:150px;aspect-ratio:2.5/3.5;border-radius:12px;overflow:hidden;background:#0c1323;border:1px solid var(--line);margin:10px auto}
    .preview img{width:100%;height:100%;object-fit:cover}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
    .hidden{display:none!important}
    .note{font-size:12px;color:var(--muted);line-height:1.4}
  </style>
</head>
<body>
<div class="app">
  <header>
    <p class="eyebrow">Álbum personal</p>
    <h1>Mi Álbum TCG</h1>
    <div class="toolbar">
      <select id="setSelect"></select>
      <button class="btn primary" id="cameraTop">📷 Foto</button>
    </div>
    <input id="search" class="search" placeholder="Buscar por número (ej. 17)" inputmode="numeric" style="margin-top:10px">
  </header>

  <section class="summary">
    <div class="stat"><span class="eyebrow">Cartas</span><strong id="ownedText">0 / 0</strong><div class="progress"><span id="bar"></span></div></div>
    <div class="stat"><span class="eyebrow">Completado</span><strong id="percentText">0%</strong><div class="note" id="repeatText">0 repetidas</div></div>
  </section>

  <div class="section-head"><div><p class="eyebrow">Colección activa</p><h2 id="setTitle"></h2></div><span id="setCode"></span></div>
  <main id="grid" class="grid"></main>
</div>

<button class="fab" id="cameraFab">＋ Fotografiar</button>
<input id="photoInput" type="file" accept="image/*" capture="environment" class="hidden">

<div class="modal" id="modal">
  <div class="sheet">
    <h3 id="modalTitle">Añadir carta</h3>
    <p>Haz la foto y elige dónde va. Más adelante conectaremos el reconocimiento automático.</p>
    <div class="preview hidden" id="previewWrap"><img id="previewImg" alt=""></div>
    <div class="field"><label>Colección</label><select id="modalSet"></select></div>
    <div class="field"><label>Número de carta</label><input id="cardNumber" type="number" min="1" inputmode="numeric" placeholder="Ej. 17"></div>
    <div class="field"><label>Nombre (opcional)</label><input id="cardName" type="text" placeholder="Ej. Toedscruel"></div>
    <div class="field"><label>Cantidad</label><input id="cardQty" type="number" min="1" value="1"></div>
    <div class="actions">
      <button class="btn" id="cancelBtn">Cancelar</button>
      <button class="btn primary" id="saveBtn">Guardar</button>
    </div>
    <p class="note" style="margin-top:12px">Tus cambios se guardan solo en este iPhone/navegador.</p>
  </div>
</div>

<script>
const SETS = {
  PAR:{name:"Brecha Paradójica",code:"PAR",total:266},
  SVE:{name:"Energías básicas",code:"SVE",total:8}
};

const INITIAL = {
  PAR:{
    6:{name:"Dwebble",qty:1,img:"par-006.jpg"},
    9:{name:"Steenee",qty:1,img:"par-009.jpg"},
    13:{name:"Nymble",qty:1,img:"par-013.jpg"},
    17:{name:"Toedscruel",qty:1,img:"par-017.jpg"}
  },
  SVE:{
    1:{name:"Energía Planta",qty:1,img:"sve-001.jpg"},
    2:{name:"Energía Fuego",qty:1,img:"sve-002.jpg"},
    5:{name:"Energía Psíquica",qty:1,img:"sve-005.jpg"},
    8:{name:"Energía Metálica",qty:1,img:"sve-008.jpg"}
  }
};

const KEY="miAlbumTCG_v3";
let data;
try { data=JSON.parse(localStorage.getItem(KEY)) || structuredClone(INITIAL); }
catch(e){ data=JSON.parse(JSON.stringify(INITIAL)); }

for(const s of Object.keys(SETS)){ if(!data[s]) data[s]={}; }
let active="PAR";
let pendingPhoto=null;
let editingNumber=null;

const $=s=>document.querySelector(s);
const setSelect=$("#setSelect"), modalSet=$("#modalSet"), grid=$("#grid"), modal=$("#modal");

function initSelects(){
  for(const [k,v] of Object.entries(SETS)){
    for(const sel of [setSelect,modalSet]){
      const o=document.createElement("option");o.value=k;o.textContent=`${v.name} (${v.code})`;sel.appendChild(o);
    }
  }
  setSelect.value=active;
}
function save(){ localStorage.setItem(KEY,JSON.stringify(data)); }
function pad(n){return String(n).padStart(3,"0")}
function render(){
  const set=SETS[active], cards=data[active]||{};
  $("#setTitle").textContent=set.name; $("#setCode").textContent=`${set.code} · ${set.total} posiciones`;
  const owned=Object.keys(cards).filter(n=>cards[n]&&cards[n].qty>0).length;
  const repeats=Object.values(cards).reduce((a,c)=>a+Math.max(0,(c.qty||1)-1),0);
  const pct=Math.round(owned/set.total*100);
  $("#ownedText").textContent=`${owned} / ${set.total}`; $("#percentText").textContent=`${pct}%`;
  $("#repeatText").textContent=`${repeats} repetida${repeats===1?"":"s"}`; $("#bar").style.width=pct+"%";
  grid.innerHTML="";
  const q=parseInt($("#search").value,10);
  for(let i=1;i<=set.total;i++){
    if(Number.isFinite(q)&&q>0&&i!==q) continue;
    const c=cards[i], el=document.createElement("button");
    el.className="slot "+(c?"":"empty"); el.dataset.n=i;
    if(c){
      el.innerHTML=`<img src="${c.img||""}" alt="${c.name||""}" onerror="this.style.display='none'">
        <span class="num">#${pad(i)}</span>${(c.qty||1)>1?`<span class="qty">×${c.qty}</span>`:""}
        <span class="name">${c.name||set.code+" #"+pad(i)}</span>`;
    }else{
      el.innerHTML=`<span class="num">#${pad(i)}</span><div class="placeholder"><b>＋</b><small>vacío</small></div>`;
    }
    el.onclick=()=>openManual(i);
    grid.appendChild(el);
  }
}
function openManual(n){
  editingNumber=n; pendingPhoto=null; $("#previewWrap").classList.add("hidden");
  modalSet.value=active; $("#cardNumber").value=n;
  const c=(data[active]||{})[n];
  $("#cardName").value=c?.name||""; $("#cardQty").value=c?.qty||1;
  $("#modalTitle").textContent=c?"Editar carta":"Añadir carta";
  modal.classList.add("open");
}
function openCamera(){ $("#photoInput").click(); }
async function photoToDataURL(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(), r=new FileReader();
    r.onload=e=>{img.onload=()=>{
      const max=900, scale=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      resolve(c.toDataURL("image/jpeg",.78));
    };img.src=e.target.result};r.onerror=reject;r.readAsDataURL(file);
  });
}
$("#photoInput").onchange=async e=>{
  const f=e.target.files?.[0]; if(!f)return;
  pendingPhoto=await photoToDataURL(f); editingNumber=null;
  $("#previewImg").src=pendingPhoto; $("#previewWrap").classList.remove("hidden");
  modalSet.value=active; $("#cardNumber").value=""; $("#cardName").value=""; $("#cardQty").value=1;
  $("#modalTitle").textContent="Colocar fotografía"; modal.classList.add("open"); e.target.value="";
};
$("#saveBtn").onclick=()=>{
  const s=modalSet.value,n=parseInt($("#cardNumber").value,10),set=SETS[s];
  if(!n||n<1||n>set.total){alert(`Pon un número entre 1 y ${set.total}.`);return;}
  const old=(data[s]||{})[n]||{};
  data[s][n]={name:$("#cardName").value.trim()||old.name||`${set.code} #${pad(n)}`,
              qty:Math.max(1,parseInt($("#cardQty").value,10)||1),
              img:pendingPhoto||old.img||""};
  save(); active=s; setSelect.value=s; modal.classList.remove("open"); render();
};
$("#cancelBtn").onclick=()=>modal.classList.remove("open");
modal.onclick=e=>{if(e.target===modal)modal.classList.remove("open")};
setSelect.onchange=e=>{active=e.target.value;$("#search").value="";render()};
$("#search").oninput=render;
$("#cameraFab").onclick=openCamera; $("#cameraTop").onclick=openCamera;

initSelects(); render();
</script>
</body>
</html>
